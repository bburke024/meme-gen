<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meme Generator on Steroids 🔥</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    
    const Upload = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>;
    const Wand2 = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M3 21l9-9M12.2 6.2 11 5"/></svg>;
    const Download = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>;
    const Type = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>;
    const Sparkles = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3ZM5 3v4M3 5h4M19 17v4M17 19h4"/></svg>;

    const MemeGenerator = () => {
      const [image, setImage] = useState(null);
      const [texts, setTexts] = useState([]);
      const [selectedTextId, setSelectedTextId] = useState(null);
      const [aiSuggestions, setAiSuggestions] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);

      const templates = [
        { name: 'Distracted Boyfriend', url: 'https://i.imgflip.com/1ur9b0.jpg' },
        { name: 'Drake Hotline', url: 'https://i.imgflip.com/30b1gx.jpg' },
        { name: 'Two Buttons', url: 'https://i.imgflip.com/1g8my4.jpg' },
        { name: 'Change My Mind', url: 'https://i.imgflip.com/24y43o.jpg' },
        { name: 'Disaster Girl', url: 'https://i.imgflip.com/2od6n8.jpg' },
      ];

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setImage(event.target.result);
            setTexts([]);
            setAiSuggestions([]);
          };
          reader.readAsDataURL(file);
        }
      };

      const loadTemplate = (url) => {
        setImage(url);
        setTexts([]);
        setAiSuggestions([]);
      };

      const generateAICaptions = async () => {
        if (!image) return;
        
        setIsGenerating(true);
        try {
          let imageData = image;
          if (image.startsWith('http')) {
            const response = await fetch(image);
            const blob = await response.blob();
            imageData = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onloadend = () => resolve(reader.result);
              reader.readAsDataURL(blob);
            });
          }

          const base64Data = imageData.split(',')[1];
          const mediaType = imageData.split(';')[0].split(':')[1];

          const apiResponse = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 1000,
              messages: [{
                role: 'user',
                content: [
                  { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64Data } },
                  { type: 'text', text: 'Analyze this image and generate 5 hilarious meme captions. Return ONLY a JSON array like: [{"top": "TOP TEXT", "bottom": "BOTTOM TEXT"}, ...]. Some can be single-line. Be creative!' }
                ]
              }]
            })
          });

          const data = await apiResponse.json();
          const responseText = data.content.filter(item => item.type === 'text').map(item => item.text).join('');
          const jsonMatch = responseText.match(/\[[\s\S]*\]/);
          if (jsonMatch) setAiSuggestions(JSON.parse(jsonMatch[0]));
        } catch (error) {
          console.error('AI error:', error);
          alert('Failed to generate captions!');
        }
        setIsGenerating(false);
      };

      const applySuggestion = (suggestion) => {
        const newTexts = [];
        if (suggestion.top) newTexts.push({ id: Date.now(), text: suggestion.top, x: 50, y: 10, fontSize: 48, color: '#FFFFFF', stroke: '#000000', fontFamily: 'Impact' });
        if (suggestion.bottom) newTexts.push({ id: Date.now() + 1, text: suggestion.bottom, x: 50, y: 85, fontSize: 48, color: '#FFFFFF', stroke: '#000000', fontFamily: 'Impact' });
        setTexts(newTexts);
      };

      const addText = () => {
        const newText = { id: Date.now(), text: 'NEW TEXT', x: 50, y: 50, fontSize: 48, color: '#FFFFFF', stroke: '#000000', fontFamily: 'Impact' };
        setTexts([...texts, newText]);
        setSelectedTextId(newText.id);
      };

      const updateText = (id, updates) => {
        setTexts(texts.map(t => t.id === id ? { ...t, ...updates } : t));
      };

      const deleteText = (id) => {
        setTexts(texts.filter(t => t.id !== id));
        setSelectedTextId(null);
      };

      const drawMeme = () => {
        const canvas = canvasRef.current;
        if (!canvas || !image) return;

        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          texts.forEach(textObj => {
            ctx.font = `${textObj.fontSize}px ${textObj.fontFamily}`;
            ctx.fillStyle = textObj.color;
            ctx.strokeStyle = textObj.stroke;
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const x = (textObj.x / 100) * canvas.width;
            const y = (textObj.y / 100) * canvas.height;
            ctx.strokeText(textObj.text.toUpperCase(), x, y);
            ctx.fillText(textObj.text.toUpperCase(), x, y);
          });
        };
        img.src = image;
      };

      useEffect(() => { drawMeme(); }, [image, texts]);

      const downloadMeme = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'epic-meme.png';
          a.click();
          URL.revokeObjectURL(url);
        });
      };

      const selectedText = texts.find(t => t.id === selectedTextId);

      return (
        <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', padding: '2rem' }}>
          <div style={{ maxWidth: '1400px', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
              <h1 style={{ fontSize: '3rem', color: 'white', margin: '0 0 0.5rem 0', fontWeight: '900', textShadow: '0 2px 10px rgba(0,0,0,0.3)' }}>
                <Sparkles /> MEME GENERATOR ON STEROIDS <Sparkles />
              </h1>
              <p style={{ color: 'rgba(255,255,255,0.9)', fontSize: '1.2rem' }}>AI-Powered • Drag & Drop • Export Ready</p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 400px', gap: '2rem' }}>
              <div>
                <div style={{ background: 'white', borderRadius: '12px', padding: '2rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)' }}>
                  {!image && (
                    <div style={{ textAlign: 'center' }}>
                      <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display: 'none' }} />
                      <button onClick={() => fileInputRef.current.click()} style={{ background: '#667eea', color: 'white', border: 'none', padding: '1rem 2rem', borderRadius: '8px', fontSize: '1.1rem', cursor: 'pointer', marginBottom: '2rem', display: 'inline-flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}>
                        <Upload /> Upload Image
                      </button>
                      <div style={{ marginTop: '2rem' }}>
                        <h3 style={{ marginBottom: '1rem', color: '#333' }}>Or choose a template:</h3>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(120px, 1fr))', gap: '1rem' }}>
                          {templates.map((template, idx) => (
                            <div key={idx} onClick={() => loadTemplate(template.url)} style={{ cursor: 'pointer', borderRadius: '8px', overflow: 'hidden', border: '2px solid #e0e0e0' }}>
                              <img src={template.url} alt={template.name} style={{ width: '100%', display: 'block' }} />
                              <div style={{ padding: '0.5rem', background: '#f5f5f5', fontSize: '0.85rem', textAlign: 'center' }}>{template.name}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {image && (
                    <div>
                      <div style={{ marginBottom: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                        <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display: 'none' }} />
                        <button onClick={() => fileInputRef.current.click()} style={{ background: '#667eea', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Upload /> New Image</button>
                        <button onClick={addText} style={{ background: '#4CAF50', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Type /> Add Text</button>
                        <button onClick={generateAICaptions} disabled={isGenerating} style={{ background: isGenerating ? '#ccc' : '#FF6B6B', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: isGenerating ? 'not-allowed' : 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Wand2 /> {isGenerating ? 'Generating...' : 'AI Captions'}</button>
                        <button onClick={downloadMeme} style={{ background: '#9C27B0', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600', marginLeft: 'auto' }}><Download /> Download</button>
                      </div>
                      <div style={{ border: '3px solid #e0e0e0', borderRadius: '8px', overflow: 'hidden', background: '#f5f5f5', display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '400px' }}>
                        <canvas ref={canvasRef} style={{ maxWidth: '100%', height: 'auto', display: 'block' }} />
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div>
                {aiSuggestions.length > 0 && (
                  <div style={{ background: 'white', borderRadius: '12px', padding: '1.5rem', marginBottom: '1rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)' }}>
                    <h3 style={{ margin: '0 0 1rem 0' }}><Sparkles /> AI Suggestions</h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                      {aiSuggestions.map((suggestion, idx) => (
                        <div key={idx} onClick={() => applySuggestion(suggestion)} style={{ padding: '1rem', background: '#f5f5f5', borderRadius: '8px', cursor: 'pointer' }}>
                          {suggestion.top && <div style={{ fontWeight: 'bold', marginBottom: '0.25rem' }}>{suggestion.top}</div>}
                          {suggestion.bottom && <div>{suggestion.bottom}</div>}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {selectedText && (
                  <div style={{ background: 'white', borderRadius: '12px', padding: '1.5rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)' }}>
                    <h3 style={{ margin: '0 0 1rem 0' }}>Edit Text</h3>
                    <div style={{ marginBottom: '1rem' }}>
                      <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600' }}>Text</label>
                      <input type="text" value={selectedText.text} onChange={(e) => updateText(selectedTextId, { text: e.target.value })} style={{ width: '100%', padding: '0.75rem', borderRadius: '6px', border: '2px solid #e0e0e0', fontSize: '1rem', boxSizing: 'border-box' }} />
                    </div>
                    <div style={{ marginBottom: '1rem' }}>
                      <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600' }}>Font Size: {selectedText.fontSize}px</label>
                      <input type="range" min="20" max="120" value={selectedText.fontSize} onChange={(e) => updateText(selectedTextId, { fontSize: parseInt(e.target.value) })} style={{ width: '100%' }} />
                    </div>
                    <button onClick={() => deleteText(selectedTextId)} style={{ width: '100%', background: '#f44336', color: 'white', border: 'none', padding: '0.75rem', borderRadius: '6px', cursor: 'pointer', fontWeight: '600' }}>Delete Text</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<MemeGenerator />);
  </script>
</body>
</html>
