<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meme Generator 🔥</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    
    const Upload = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>;
    const Download = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>;
    const Type = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>;
    const Sparkles = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3ZM5 3v4M3 5h4M19 17v4M17 19h4"/></svg>;
    const Palette = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>;

    const MemeGenerator = () => {
      const [image, setImage] = useState(null);
      const [texts, setTexts] = useState([]);
      const [selectedTextId, setSelectedTextId] = useState(null);
      const canvasRef = useRef(null);
      const fileInputRef = useRef(null);

      const templates = [
        { name: 'Distracted Boyfriend', url: 'https://i.imgflip.com/1ur9b0.jpg' },
        { name: 'Drake Hotline', url: 'https://i.imgflip.com/30b1gx.jpg' },
        { name: 'Two Buttons', url: 'https://i.imgflip.com/1g8my4.jpg' },
        { name: 'Change My Mind', url: 'https://i.imgflip.com/24y43o.jpg' },
        { name: 'Disaster Girl', url: 'https://i.imgflip.com/2od6n8.jpg' },
        { name: 'Expanding Brain', url: 'https://i.imgflip.com/1jwhww.jpg' },
      ];

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setImage(event.target.result);
            setTexts([]);
          };
          reader.readAsDataURL(file);
        }
      };

      const loadTemplate = (url) => {
        setImage(url);
        setTexts([]);
      };

      const addTopText = () => {
        const newText = { 
          id: Date.now(), 
          text: 'TOP TEXT', 
          x: 50, 
          y: 15, 
          fontSize: 48, 
          color: '#FFFFFF', 
          stroke: '#000000', 
          fontFamily: 'Impact' 
        };
        setTexts([...texts, newText]);
        setSelectedTextId(newText.id);
      };

      const addBottomText = () => {
        const newText = { 
          id: Date.now(), 
          text: 'BOTTOM TEXT', 
          x: 50, 
          y: 85, 
          fontSize: 48, 
          color: '#FFFFFF', 
          stroke: '#000000', 
          fontFamily: 'Impact' 
        };
        setTexts([...texts, newText]);
        setSelectedTextId(newText.id);
      };

      const addCustomText = () => {
        const newText = { 
          id: Date.now(), 
          text: 'YOUR TEXT', 
          x: 50, 
          y: 50, 
          fontSize: 48, 
          color: '#FFFFFF', 
          stroke: '#000000', 
          fontFamily: 'Impact' 
        };
        setTexts([...texts, newText]);
        setSelectedTextId(newText.id);
      };

      const updateText = (id, updates) => {
        setTexts(texts.map(t => t.id === id ? { ...t, ...updates } : t));
      };

      const deleteText = (id) => {
        setTexts(texts.filter(t => t.id !== id));
        setSelectedTextId(null);
      };

      const drawMeme = () => {
        const canvas = canvasRef.current;
        if (!canvas || !image) return;

        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          texts.forEach(textObj => {
            ctx.font = `${textObj.fontSize}px ${textObj.fontFamily}`;
            ctx.fillStyle = textObj.color;
            ctx.strokeStyle = textObj.stroke;
            ctx.lineWidth = 3;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const x = (textObj.x / 100) * canvas.width;
            const y = (textObj.y / 100) * canvas.height;
            ctx.strokeText(textObj.text.toUpperCase(), x, y);
            ctx.fillText(textObj.text.toUpperCase(), x, y);
          });
        };
        img.src = image;
      };

      useEffect(() => { drawMeme(); }, [image, texts]);

      const downloadMeme = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'my-meme.png';
          a.click();
          URL.revokeObjectURL(url);
        });
      };

      const selectedText = texts.find(t => t.id === selectedTextId);

      return (
        <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', padding: '2rem' }}>
          <div style={{ maxWidth: '1400px', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
              <h1 style={{ fontSize: '3rem', color: 'white', margin: '0 0 0.5rem 0', fontWeight: '900', textShadow: '0 2px 10px rgba(0,0,0,0.3)' }}>
                🔥 MEME GENERATOR 🔥
              </h1>
              <p style={{ color: 'rgba(255,255,255,0.9)', fontSize: '1.2rem' }}>
                Upload • Customize • Download
              </p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: image ? '1fr 400px' : '1fr', gap: '2rem' }}>
              <div>
                <div style={{ background: 'white', borderRadius: '12px', padding: '2rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)' }}>
                  {!image && (
                    <div style={{ textAlign: 'center' }}>
                      <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display: 'none' }} />
                      <button onClick={() => fileInputRef.current.click()} style={{ background: '#667eea', color: 'white', border: 'none', padding: '1rem 2rem', borderRadius: '8px', fontSize: '1.1rem', cursor: 'pointer', marginBottom: '2rem', display: 'inline-flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}>
                        <Upload /> Upload Your Image
                      </button>
                      <div style={{ marginTop: '2rem' }}>
                        <h3 style={{ marginBottom: '1rem', color: '#333' }}>Or choose a popular template:</h3>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: '1rem' }}>
                          {templates.map((template, idx) => (
                            <div key={idx} onClick={() => loadTemplate(template.url)} style={{ cursor: 'pointer', borderRadius: '8px', overflow: 'hidden', border: '2px solid #e0e0e0', transition: 'transform 0.2s' }} onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.05)'} onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}>
                              <img src={template.url} alt={template.name} style={{ width: '100%', display: 'block' }} />
                              <div style={{ padding: '0.5rem', background: '#f5f5f5', fontSize: '0.85rem', textAlign: 'center', fontWeight: '600' }}>{template.name}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {image && (
                    <div>
                      <div style={{ marginBottom: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                        <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{ display: 'none' }} />
                        <button onClick={() => fileInputRef.current.click()} style={{ background: '#667eea', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Upload size={18} /> New Image</button>
                        <button onClick={addTopText} style={{ background: '#4CAF50', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Type size={18} /> Top Text</button>
                        <button onClick={addBottomText} style={{ background: '#FF9800', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Type size={18} /> Bottom Text</button>
                        <button onClick={addCustomText} style={{ background: '#2196F3', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600' }}><Palette size={18} /> Custom</button>
                        <button onClick={downloadMeme} style={{ background: '#9C27B0', color: 'white', border: 'none', padding: '0.75rem 1.5rem', borderRadius: '8px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.5rem', fontWeight: '600', marginLeft: 'auto' }}><Download size={18} /> Download</button>
                      </div>
                      <div style={{ border: '3px solid #e0e0e0', borderRadius: '8px', overflow: 'hidden', background: '#f5f5f5', display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '400px' }}>
                        <canvas ref={canvasRef} style={{ maxWidth: '100%', height: 'auto', display: 'block' }} />
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {image && (
                <div>
                  {selectedText && (
                    <div style={{ background: 'white', borderRadius: '12px', padding: '1.5rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)', marginBottom: '1rem' }}>
                      <h3 style={{ margin: '0 0 1rem 0', color: '#333' }}>Edit Text</h3>
                      <div style={{ marginBottom: '1rem' }}>
                        <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>Text</label>
                        <input type="text" value={selectedText.text} onChange={(e) => updateText(selectedTextId, { text: e.target.value })} style={{ width: '100%', padding: '0.75rem', borderRadius: '6px', border: '2px solid #e0e0e0', fontSize: '1rem', boxSizing: 'border-box' }} />
                      </div>
                      <div style={{ marginBottom: '1rem' }}>
                        <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>Font Size: {selectedText.fontSize}px</label>
                        <input type="range" min="20" max="120" value={selectedText.fontSize} onChange={(e) => updateText(selectedTextId, { fontSize: parseInt(e.target.value) })} style={{ width: '100%' }} />
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem', marginBottom: '1rem' }}>
                        <div>
                          <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>X: {selectedText.x}%</label>
                          <input type="range" min="0" max="100" value={selectedText.x} onChange={(e) => updateText(selectedTextId, { x: parseInt(e.target.value) })} style={{ width: '100%' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>Y: {selectedText.y}%</label>
                          <input type="range" min="0" max="100" value={selectedText.y} onChange={(e) => updateText(selectedTextId, { y: parseInt(e.target.value) })} style={{ width: '100%' }} />
                        </div>
                      </div>
                      <div style={{ marginBottom: '1rem' }}>
                        <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>Font</label>
                        <select value={selectedText.fontFamily} onChange={(e) => updateText(selectedTextId, { fontFamily: e.target.value })} style={{ width: '100%', padding: '0.75rem', borderRadius: '6px', border: '2px solid #e0e0e0', fontSize: '1rem', background: 'white' }}>
                          <option value="Impact">Impact (Classic)</option>
                          <option value="Arial">Arial</option>
                          <option value="Comic Sans MS">Comic Sans MS</option>
                          <option value="Courier New">Courier New</option>
                          <option value="Georgia">Georgia</option>
                          <option value="Times New Roman">Times New Roman</option>
                        </select>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem', marginBottom: '1rem' }}>
                        <div>
                          <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>Text Color</label>
                          <input type="color" value={selectedText.color} onChange={(e) => updateText(selectedTextId, { color: e.target.value })} style={{ width: '100%', height: '40px', borderRadius: '6px', border: '2px solid #e0e0e0', cursor: 'pointer' }} />
                        </div>
                        <div>
                          <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600', color: '#555' }}>Outline Color</label>
                          <input type="color" value={selectedText.stroke} onChange={(e) => updateText(selectedTextId, { stroke: e.target.value })} style={{ width: '100%', height: '40px', borderRadius: '6px', border: '2px solid #e0e0e0', cursor: 'pointer' }} />
                        </div>
                      </div>
                      <button onClick={() => deleteText(selectedTextId)} style={{ width: '100%', background: '#f44336', color: 'white', border: 'none', padding: '0.75rem', borderRadius: '6px', cursor: 'pointer', fontWeight: '600' }}>Delete Text</button>
                    </div>
                  )}

                  {texts.length > 0 && (
                    <div style={{ background: 'white', borderRadius: '12px', padding: '1.5rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)' }}>
                      <h3 style={{ margin: '0 0 1rem 0', color: '#333' }}>Text Layers ({texts.length})</h3>
                      {texts.map(text => (
                        <div key={text.id} onClick={() => setSelectedTextId(text.id)} style={{ padding: '0.75rem', background: selectedTextId === text.id ? '#667eea' : '#f5f5f5', color: selectedTextId === text.id ? 'white' : 'black', borderRadius: '6px', marginBottom: '0.5rem', cursor: 'pointer', fontWeight: selectedTextId === text.id ? '600' : 'normal', transition: 'all 0.2s' }}>
                          {text.text}
                        </div>
                      ))}
                    </div>
                  )}

                  {texts.length === 0 && (
                    <div style={{ background: 'white', borderRadius: '12px', padding: '2rem', boxShadow: '0 10px 40px rgba(0,0,0,0.2)', textAlign: 'center' }}>
                      <Sparkles />
                      <h3 style={{ margin: '1rem 0 0.5rem 0', color: '#333' }}>Add Some Text!</h3>
                      <p style={{ color: '#666', fontSize: '0.9rem' }}>Click "Top Text", "Bottom Text", or "Custom" to get started</p>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<MemeGenerator />);
  </script>
</body>
</html>
